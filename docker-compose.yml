services:
  hrf-arcs:
    build: .
    container_name: hrf-arcs
    ports:
      - "7070:7070"
    environment:
      - ARCS_URL=https://arcs.lumpy-arcs.com
      - ARCS_CDN=https://arcs.lumpy-arcs.com/hrf/
      - ARCS_PORT=7070
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-onboarding@resend.dev}
    volumes:
      - hrf-db:/data
    restart: unless-stopped

volumes:
  hrf-db:
